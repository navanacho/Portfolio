<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Ignacio Navarria - Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="bg-aurora" aria-hidden="true"></div>
    <main class="hero">
        <section class="hero-left">
            <h1 class="bigname">IGNACIO<br/>NAVARRIA</h1>
            <p class="subtitle">Full Stack Developer</p>

            <!-- Botón de contacto (StarBorder) -->
            <a class="star-btn" href="mailto:navarria332@gmail.com">contacto: MAIL</a>
        </section>

        <section class="hero-right">
            <!-- AVATAR: Dos opciones -->
            <!-- Opción A: model-viewer con GLB remoto o local.
           Cambiá el atributo src por tu link (ej: https://models.readyplayer.me/68f14cb0... .glb)
           O poné src="assets/avatar.glb" si lo descargás a /assets -->
            <div class="avatar-container">
                <model-viewer id="mv-avatar" src="assets/ignacio_avatar.glb"
                      alt="Avatar de Ignacio"
                      camera-controls auto-rotate ar
                      style="width:360px; height:360px;">
                </model-viewer>
            </div>
        </section>
  </main>

  <!-- Sección con botones expandibles -->
  <section class="panels" id="skills">
    <div class="panel">
      <!-- data-target especifica el id del panel expandible -->
      <button class="star-btn panel-toggle" data-target="#panel-tech">(icono) tecnologías</button>
      <div id="panel-tech" class="panel-content">
        <!-- Reemplazá o agregá SVGs en assets/icons y luego inserta <img src="assets/icons/python.svg"> si querés -->
        <div class="icon-grid" id="tech-grid">
          <!-- íconos se insertan por JS o los podés agregar estáticos -->
        </div>
      </div>
    </div>

    <div class="panel">
      <button class="star-btn panel-toggle" data-target="#panel-tools">(icono) herramientas</button>
      <div id="panel-tools" class="panel-content">
        <div class="icon-grid" id="tools-grid"></div>
      </div>
    </div>

    <div class="panel">
      <button class="star-btn panel-toggle" data-target="#panel-cv">(icono) descargar cv</button>
      <div id="panel-cv" class="panel-content">
        <div class="cv-content">
          <!-- Link directo para descargar (pegar tu PDF en /assets/IGNACIO_CV.pdf) -->
          <a class="download-cv" href="assets/IGNACIO_NAVARRIA_CV.pdf" download>Descargar CV (PDF)</a>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer / educación -->
  <footer id="contacto" class="footer">
    <div class="footer-left">EDUCACIÓN</div>
    <div class="footer-right">© Ignacio Navarria</div>
  </footer>

  <!-- Script principal -->
  <script src="main.js"></script>
</body>
</html>
